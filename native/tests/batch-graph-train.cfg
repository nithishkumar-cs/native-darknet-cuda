# Mixed graph for distinct-sample minibatch CPU/CUDA training parity: 3x3 and strided 3x3
# batch-normalized convolutions, maxpool, a pointwise (1x1) batch-normalized convolution,
# shortcut, reorg, two- and one-source routes, upsample, and 1x1/3x3 non-normalized heads
# feeding two YOLO layers. Every layer kind the CUDA trainer launches once per minibatch.
[net]
channels=3
height=8
width=8

# 0: 8x8x4
[convolutional]
batch_normalize=1
filters=4
size=3
stride=1
pad=1
activation=leaky

# 1: 4x4x4
[maxpool]
size=2
stride=2

# 2: 4x4x8
[convolutional]
batch_normalize=1
filters=8
size=3
stride=1
pad=1
activation=leaky

# 3: 4x4x8, pointwise
[convolutional]
batch_normalize=1
filters=8
size=1
stride=1
activation=leaky

# 4: 4x4x8
[shortcut]
from=-2
activation=linear

# 5: 2x2x8
[convolutional]
batch_normalize=1
filters=8
size=3
stride=2
pad=1
activation=leaky

# 6: 2x2x6
[convolutional]
filters=6
size=1
stride=1
activation=linear

# 7
[yolo]
mask=0
anchors=2,2,4,4
classes=1

# 8: layer 4, 4x4x8
[route]
layers=-4

# 9: 2x2x32
[reorg]
stride=2

# 10: layers 9 and 5, 2x2x40
[route]
layers=-1,5

# 11: 4x4x40
[upsample]
stride=2

# 12: layers 11 and 3, 4x4x48
[route]
layers=-1,3

# 13: 4x4x6
[convolutional]
filters=6
size=3
stride=1
pad=1
activation=linear

# 14
[yolo]
mask=1
anchors=2,2,4,4
classes=1
